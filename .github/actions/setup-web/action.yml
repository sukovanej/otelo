name: Set up the web packages
description: Install Node and pnpm from mise.toml, and restore the pnpm store

runs:
  using: composite
  steps:
    # The action caches what `mise install` downloads, keyed by mise.toml.
    - uses: jdx/mise-action@v5
      with:
        install_args: node pnpm
    # mise puts the root of the pnpm install on PATH, and that root holds a `dist` directory, so a
    # later `dist build` finds the directory instead of cargo-dist. A path added later goes first.
    - shell: bash
      run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

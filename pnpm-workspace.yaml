packages:
  - packages/*

# One version of each shared dependency for every package.
catalog:
  "@fontsource/ibm-plex-mono": ^5.3.0
  "@fontsource/ibm-plex-sans": ^5.3.0
  "@solidjs/router": ^1.0.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24.0.0
  openapi-typescript: ^7.13.0
  oxfmt: ^0.71.0
  oxlint: ^1.86.0
  oxlint-tsgolint: ^7.0.2003
  solid-js: ^1.9.15
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: ^8.3.1
  vite-plugin-solid: ^2.11.14
  vitest: ^5.0.2

# Wait an hour before installing a new release, not the day pnpm defaults to, so
# new versions arrive fast and a hijacked release caught in its first hour never does.
minimumReleaseAge: 60

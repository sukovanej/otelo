packages:
  - packages/*

# One version of each shared dependency for every package. Solid 2 is a release candidate
# whose packages work only with each other's builds, so they are pinned exactly.
catalog:
  "@fontsource/ibm-plex-mono": ^5.3.0
  "@fontsource/ibm-plex-sans": ^5.3.0
  "@solidjs/router": 2.0.0-next.33
  "@solidjs/vite-plugin": 3.0.0-next.47
  "@solidjs/web": 2.0.0-rc.13
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/solid-query": 6.0.0-rc.5
  "@types/node": ^24.0.0
  openapi-typescript: ^7.13.0
  oxfmt: ^0.71.0
  oxlint: ^1.86.0
  oxlint-tsgolint: ^7.0.2003
  solid-js: 2.0.0-rc.13
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: ^8.3.1
  vitest: ^5.0.2

# Wait an hour before installing a new release, not the day pnpm defaults to, so
# new versions arrive fast and a hijacked release caught in its first hour never does.
minimumReleaseAge: 60

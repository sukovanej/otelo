[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
insta = { version = "1.48", features = ["glob"] }
jiff = "0.2.37"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics", "with-serde"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs", "internal-logs"] }
prost = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
siner-otlp = { path = "crates/otlp" }
siner-query = { path = "crates/query" }
siner-telemetry = { path = "crates/telemetry" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util = "0.7.19"
tonic = { version = "0.14", default-features = false, features = ["server", "router", "gzip"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.1.4", features = ["json"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_64"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

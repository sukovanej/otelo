[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.6"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/sukovanej/otelo"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
crc32c = "0.6.8"
data-encoding = "2.11"
flate2 = "1"
getrandom = "0.4"
insta = { version = "1.49", features = ["glob"] }
jiff = "0.2.38"
keyring = "4.2.0"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics", "with-serde"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs", "internal-logs"] }
prost = "0.14"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = "1.0.28"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tar = "0.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
otelo-api = { path = "crates/api" }
otelo-host = { path = "crates/host" }
otelo-journal = { path = "crates/journal" }
otelo-journal-files = { path = "crates/journal-files" }
otelo-otlp = { path = "crates/otlp" }
otelo-query = { path = "crates/query" }
otelo-state = { path = "crates/state" }
otelo-indexed-storage = { path = "crates/indexed-storage" }
otelo-indexed-storage-sqlite = { path = "crates/indexed-storage-sqlite" }
otelo-update = { path = "crates/update" }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util = "0.7.19"
tonic = { version = "0.14", default-features = false, features = ["server", "router", "gzip"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
zstd = "0.14.0"
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = "github"
# The release only makes sense for a tag, so a pull request runs no dist job.
pr-run-mode = "skip"
installers = ["shell"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# `otelo` embeds `packages/app/dist` at compile time, so each build job builds the UI first.
github-build-setup = "../build-setup.yml"
install-path = "~/.local/bin"
# `otelo update` replaces the binary itself.
install-updater = false
# `otelo update` unpacks this archive.
unix-archive = ".tar.gz"

[profile.dist]
inherits = "release"
lto = "thin"

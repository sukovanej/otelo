[tools]
node = "24"
pnpm = "12"
cargo-dist = "0.33.0"

[vars]
# The files oxfmt formats: the web packages and their configuration.
web_files = "packages package.json pnpm-workspace.yaml tsconfig.base.json .oxlintrc.json .oxfmtrc.json"

[tasks.fmt]
description = "Format the Rust crates and the web packages"
depends = ["web:fmt"]
run = "cargo fmt --all"

[tasks."web:install"]
description = "Install the packages of the web UI"
run = "pnpm install --frozen-lockfile"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "packages/*/package.json"]
outputs = ["node_modules/.modules.yaml"]

[tasks."web:build"]
description = "Build the web UI into packages/app/dist, which the otelo binary embeds"
depends = ["web:install"]
dir = "packages/app"
run = "pnpm exec vite build"
sources = ["../*/src/**/*", "index.html", "vite.config.ts", "../../pnpm-lock.yaml"]
outputs = ["dist/index.html"]

[tasks."web:dev"]
description = "Serve the web UI with reloading on :5173, with the API of a daemon on :7070"
depends = ["web:install"]
dir = "packages/app"
run = "pnpm exec vite"

[tasks."serve:dev"]
description = "Run the daemon on :7070 without a password, with its data in target/dev, where it sends its own logs and traces"
run = "cargo run -q -- serve --data target/dev --unsafe-no-auth"

# `npx skills update` skips a skill installed from a local path, so a change to skills/ reaches
# this checkout only through a new `add`.
[tasks.skills]
description = "Install the skills of skills/ into this checkout for Claude Code and Codex"
run = "npx -y skills add . -a claude-code -a codex -y"

[tasks."api:generate"]
description = "Write the OpenAPI spec of the daemon to packages/api, and the TypeScript types of it"
depends = ["web:install"]
run = [
  "cargo run -q -- openapi > packages/api/openapi.json",
  "node packages/api/generate.ts",
]

[tasks."web:fmt"]
description = "Format the web packages with oxfmt"
depends = ["web:install"]
run = "pnpm exec oxfmt {{vars.web_files}}"

[tasks."check:fmt"]
description = "Rust formatting"
run = "cargo fmt --all --check"

[tasks."check:clippy"]
description = "Rust lints, with every warning a failure"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."check:test"]
description = "Rust tests, against the built UI"
depends = ["web:build"]
run = "cargo test --workspace"

[tasks."check:web:fmt"]
description = "Web formatting"
depends = ["web:install"]
run = "pnpm exec oxfmt --check {{vars.web_files}}"

[tasks."check:web:lint"]
description = "Web lints with type information, with every warning a failure"
depends = ["web:install"]
run = "pnpm exec oxlint --type-aware --deny-warnings packages"

[tasks."check:web:types"]
description = "Web types, with tsc in each package"
depends = ["web:install"]
run = "pnpm --recursive exec tsc"

[tasks."web:chromium"]
description = "Install the Chromium the component tests run in, with its system libraries on CI"
depends = ["web:install"]
run = "pnpm --filter @otelo/app exec playwright install ${CI:+--with-deps} chromium-headless-shell"

[tasks."check:web:test"]
description = "Web tests, with vitest in each package"
depends = ["web:chromium"]
run = "pnpm --recursive exec vitest run"

[tasks.check]
description = "Everything a change has to pass"
depends = [
  "check:fmt",
  "check:clippy",
  "check:test",
  "check:web:fmt",
  "check:web:lint",
  "check:web:types",
  "check:web:test",
]

[tasks.release]
description = "Set the workspace version and commit the release"
usage = 'arg "<version>" help="The new version, for example 0.0.2"'
run = '''
set -eu
version="$usage_version"

echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
  || { echo "release: '$version' is not a semver version" >&2; exit 1; }
test -z "$(git status --porcelain -- . ':(exclude)CHANGELOG.md')" \
  || { echo "release: commit or stash your changes first" >&2; exit 1; }
# cargo-dist takes the notes of the GitHub release from this section.
grep -q "^## \[$version\]" CHANGELOG.md \
  || { echo "release: write the '## [$version]' section in CHANGELOG.md first" >&2; exit 1; }

perl -pi -e "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
cargo update --workspace --quiet
# The spec of the API carries the version, and a test compares it with packages/api/openapi.json.
mise run api:generate

git add Cargo.toml Cargo.lock CHANGELOG.md packages/api
git diff --cached --quiet || git commit --quiet -m "Release v$version"

echo "Next: merge this commit into main, then run:"
echo "  git tag v$version && git push origin v$version"
'''

[package]
name = "siner-storage-sqlite"
description = "The SQLite backend of siner's storage: the daily files of the logs, traces, and metrics, and the indexed attributes in the state file"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
rusqlite = { workspace = true, features = ["hooks", "limits"] }
serde = { workspace = true }
serde_json = { workspace = true }
siner-query = { workspace = true }
siner-storage = { workspace = true }
tracing = { workspace = true }
twox-hash = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

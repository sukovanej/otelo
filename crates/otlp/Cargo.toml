[package]
name = "otelo-otlp"
description = "Receives OTLP logs, traces, and metrics over HTTP and gRPC appends them to the journal, and maps a journal frame for the indexer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
otelo-indexed-storage = { workspace = true }
otelo-journal = { workspace = true }
otelo-query = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
otelo-journal-files = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["metrics", "grpc-tonic", "http-json", "gzip-tonic", "gzip-http"] }
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
rusqlite = { workspace = true }
otelo-indexed-storage-sqlite = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
